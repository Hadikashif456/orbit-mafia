title = "Orbit Mafia Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for .env.example files, docs/, and team/ folders"
paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)docs/''',
    '''(^|/)team/''',
]

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{20,}'''
tags = ["key", "groq"]

[rules.allowlist]
description = "Rule allowlist for .env.example files, docs/, and team/ folders"
paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)docs/''',
    '''(^|/)team/''',
]
